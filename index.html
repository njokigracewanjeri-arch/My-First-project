<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#fff0f6; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family:sans-serif;}
.card{background:white; padding:40px; border-radius:20px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.1); max-width:400px;}
h1{color:#ff5d8f;}
p{color:#555;}
.buttons{display:flex; gap:10px; justify-content:center; margin-top:20px;}
.btn{padding:12px 20px; border-radius:25px; text-decoration:none; font-weight:bold;}
.btn-primary{background:#ff5d8f; color:white;}
.btn-outline{background:white; color:#ff5d8f; border:2px solid #ff5d8f;}
</style>
</head>
<body>
<div class="card">
<h1>Hey there, I'm Grace Wanjeri! 👋</h1>
<p>I'm a student. I love science and building cool things on the web.</p>
<div class="buttons">
<a class="btn btn-primary" href="#">My Projects</a>
<a class="btn btn-outline" href="#">Contact Me</a>
</div>
</div>
</body>
</html>
